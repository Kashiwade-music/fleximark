output = "architecture"

[limits]
max_code_lines = 1000
max_role_chars = 80

[diagrams]
targets = "lib-bin"

[visible_to]
fleximark-distribution = ["fleximark-preview-assets"]
fleximark-model = ["fleximark-parser", "fleximark-render-html", "fleximark-engine", "fleximark-language", "fleximark-application", "fleximark-lsp-transport", "fleximark-preview-http", "fleximark-cli", "fleximarkd", "fleximark-protocol-codegen"]
fleximark-parser = ["fleximark-engine", "fleximark-language", "fleximark-render-html", "fleximark-application"]
fleximark-render-html = ["fleximark-engine", "fleximark-application", "fleximark-language", "fleximark-cli", "fleximark-protocol-codegen"]
fleximark-engine = ["fleximark-preview-http", "fleximark-language", "fleximark-application", "fleximark-lsp-transport", "fleximark-cli", "fleximarkd", "fleximark-protocol-codegen"]
fleximark-language = ["fleximark-application", "fleximark-lsp-transport", "fleximark-cli", "fleximarkd"]
fleximark-application = ["fleximark-preview-assets", "fleximark-lsp-transport", "fleximark-preview-http", "fleximark-cli", "fleximarkd"]
fleximark-preview-assets = ["fleximark-lsp-transport", "fleximark-application", "fleximark-cli", "fleximarkd"]
fleximark-lsp-transport = ["fleximarkd"]
fleximark-preview-http = ["fleximark-lsp-transport", "fleximarkd"]
fleximark-protocol = ["fleximark-application", "fleximark-cli", "fleximark-lsp-transport", "fleximark-preview-http", "fleximarkd", "fleximark-protocol-codegen"]
fleximark-wire = ["fleximark-protocol", "fleximark-protocol-codegen", "fleximark-cli", "fleximarkd", "fleximark-lsp-transport", "fleximark-preview-http"]
fleximark-migration = ["fleximark-application", "fleximark-cli"]
fleximark-cli = []
fleximarkd = []
fleximark-config = ["fleximark-application", "fleximark-cli", "fleximarkd", "fleximark-migration", "fleximark-protocol-codegen"]

# Established serialization/schema derives generate external trait impls.
# No repository function-like macros are exempted from reference analysis.
[analysis]
trusted_attributes = ["serde", "schemars"]
trusted_derives = ["Serialize", "Deserialize", "JsonSchema", "serde::Serialize", "serde::Deserialize", "schemars::JsonSchema"]
trusted_macros = []
