[package]
name = "fleximark-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fleximark"
path = "src/main.rs"

[dependencies]
fleximark-engine = { path = "../fleximark-engine" }
fleximark-model = { path = "../fleximark-model" }
fleximark-plugin-host = { path = "../fleximark-plugin-host" }
fleximark-render-html = { path = "../fleximark-render-html" }
fleximarkd = { path = "../fleximarkd" }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.186"
