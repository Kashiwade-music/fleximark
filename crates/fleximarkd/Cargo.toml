[package]
name = "fleximarkd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fleximark_service"
path = "src/lib.rs"

[dependencies]
base64.workspace = true
cap-std = "3.4.6"
cap-fs-ext = "3.4.6"
fleximark-engine = { path = "../fleximark-engine" }
fleximark-lsp = { path = "../fleximark-lsp" }
fleximark-model = { path = "../fleximark-model" }
fleximark-plugin-sdk = { path = "../fleximark-plugin-sdk" }
fleximark-plugin-host = { path = "../fleximark-plugin-host" }
fleximark-protocol = { path = "../fleximark-protocol" }
fleximark-render-html = { path = "../fleximark-render-html" }
getrandom = "0.2.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
