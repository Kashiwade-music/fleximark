name: Smoke-test target VSIX
description: Install a packaged target extension and verify its runtime hashes and startup
inputs:
  vsix:
    description: VSIX path
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VSIX: ${{ inputs.vsix }}
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          xvfb-run -a python tooling/tasks/tasks.py smoke "$VSIX"
        else
          python tooling/tasks/tasks.py smoke "$VSIX"
        fi
