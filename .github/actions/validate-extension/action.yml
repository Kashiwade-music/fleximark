name: Validate extension
description: Validate the assembled six-target extension and optionally produce the CI VSIX

inputs:
  development-contracts:
    description: Run development-script and performance contracts
    default: "false"
  package-vsix:
    description: Package, validate, and upload fleximark.vsix
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-toolchain
    - name: Check build inputs
      shell: bash
      env:
        YARN_ENABLE_HARDENED_MODE: "1"
      run: |
        uv run --frozen python scripts/build.py browser
        rustup toolchain install 1.86.0 --profile minimal
        rustup +1.86.0 target add wasm32-wasip2
        CARGO_TARGET_DIR=target/msrv-fixture-1.86 cargo +1.86.0 check --manifest-path fixtures/plugin-component/Cargo.toml --target wasm32-wasip2 --locked
        CARGO_TARGET_DIR=target/msrv-1.86 cargo +1.86.0 check --workspace --all-targets --locked
        yarn install --immutable --refresh-lockfile
        yarn npm audit --all --recursive --severity high
    - name: Test development contracts
      if: inputs.development-contracts == 'true'
      shell: bash
      run: |
        uv run --frozen python -m unittest discover -s scripts/tests -p "test_*.py"
        node --test scripts/tests/semantic_release_package.test.mjs
        uv run --frozen python scripts/check_performance_budgets.py
    - name: Download platform daemons
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: daemon-*
        path: bin
        merge-multiple: true
    - name: Validate assembled extension
      shell: bash
      run: |
        uv run --frozen python scripts/create_release_manifest.py --require-all
        uv run --frozen python scripts/verify_architecture.py
        cargo fmt --all --check
        rustup target add wasm32-wasip2
        cargo test --workspace --all-targets --locked
        cargo clippy --workspace --all-targets --locked -- -D warnings
        yarn exec tsc -b
        yarn exec eslint adapters web test scripts
        mise run test-pure
        uv run --frozen python scripts/l10n_export.py
        git diff --exit-code -- l10n
        uv run --frozen python scripts/build.py extension --production
        xvfb-run -a mise run test -- --prebuilt
        yarn exec vsce ls --no-dependencies
    - name: Package and validate VSIX
      if: inputs.package-vsix == 'true'
      shell: bash
      run: |
        yarn exec vsce package --no-dependencies --out fleximark.vsix
        uv run --frozen python scripts/release_artifact.py validate --vsix fleximark.vsix
    - name: Upload VSIX
      if: inputs.package-vsix == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fleximark-vsix
        path: fleximark.vsix
        retention-days: 7
        if-no-files-found: error
