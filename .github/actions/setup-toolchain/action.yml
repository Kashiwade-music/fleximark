name: Setup toolchain and dependencies
description: Install the pinned mise toolchain and optionally restore project dependencies

inputs:
  install-dependencies:
    description: Install locked JavaScript dependencies and Rust components
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup toolchain
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        version: 2026.7.13
    - name: Cache Rust workspace builds
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: |
          . -> target
          adapters/zed -> ../../target/zed
    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: mise run setup
