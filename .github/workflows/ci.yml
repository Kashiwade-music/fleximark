name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
      - name: Verify source quality
        run: python tooling/tasks/tasks.py ci quality
      - name: Audit dependencies
        run: python tooling/tasks/tasks.py audit

  zed-product:
    name: Build universal Zed extension
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
      - name: Build and stage Zed WASM product
        run: python tooling/tasks/tasks.py ci zed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-zed
          path: |
            .artifacts/**/fleximark-zed-*.zip
            .artifacts/**/fleximark-zed-*.zip.sha256
          if-no-files-found: error
          overwrite: true

  products:
    name: Package and smoke ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-24.04,
              target: x86_64-unknown-linux-gnu,
              vscode: linux-x64,
            }
          - {
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
              vscode: linux-arm64,
            }
          - {
              os: macos-15-intel,
              target: x86_64-apple-darwin,
              vscode: darwin-x64,
            }
          - { os: macos-15, target: aarch64-apple-darwin, vscode: darwin-arm64 }
          - {
              os: windows-2025,
              target: x86_64-pc-windows-msvc,
              vscode: win32-x64,
            }
          - {
              os: windows-11-arm,
              target: aarch64-pc-windows-msvc,
              vscode: win32-arm64,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
      - name: Verify native and editor product on Linux
        if: runner.os == 'Linux'
        env:
          SOURCE_GIT_HEAD: ${{ github.sha }}
          FLEXIMARK_BROWSER_DOM: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: xvfb-run -a python tooling/tasks/tasks.py ci product
      - name: Verify native and editor product on macOS and Windows
        if: runner.os != 'Linux'
        env:
          SOURCE_GIT_HEAD: ${{ github.sha }}
        run: python tooling/tasks/tasks.py ci product
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-${{ matrix.target }}
          path: |
            .artifacts/**/*.zip
            .artifacts/**/*.zip.sha256
            .artifacts/**/*.vsix
            .artifacts/**/*.identity.json
          if-no-files-found: error
          overwrite: true

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
