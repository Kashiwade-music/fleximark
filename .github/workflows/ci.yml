name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate extension
    needs: daemon-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2
        working-directory: ${{ runner.temp }}

      - name: Install dependencies
        run: npm ci

      - name: Verify architecture contract
        run: node scripts/verify-architecture.mjs

      - name: Verify performance budgets
        run: node scripts/check-performance-budgets.mjs

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Download platform daemons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: daemon-*
          path: bin
          merge-multiple: true

      - name: Build external preview client
        run: node scripts/build-browser-client.mjs

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Install plugin component target
        run: rustup target add wasm32-wasip2

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check types
        run: npm exec -- tsc --noEmit

      - name: Lint
        run: npm exec -- eslint adapters web test scripts

      - name: Check localization bundles
        run: |
          node scripts/l10n-export.mjs
          git diff --exit-code -- l10n

      - name: Build production extension
        run: node esbuild.js --production

      - name: Run VS Code integration tests on stable
        run: xvfb-run -a npm test

      - name: Create final release manifest
        run: node scripts/create-release-manifest.mjs --require-all

      - name: Inspect extension contents
        run: npm exec -- vsce ls

      - name: Package VSIX
        run: npm exec -- vsce package --out fleximark.vsix

      - name: Validate VSIX archive and contents
        shell: bash
        run: |
          unzip -t fleximark.vsix
          if unzip -Z1 fleximark.vsix | grep -E '(^|/)(src|test|markdown_for_debug|node_modules)/|(^|/)parserPlugin\.js$'; then
            echo 'Unexpected development files found in VSIX' >&2
            exit 1
          fi

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleximark-vsix
          path: fleximark.vsix
          retention-days: 7
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  daemon-platforms:
    name: Build daemon for ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: windows-2025, platform: win32, arch: x64 }
          - { os: windows-11-arm, platform: win32, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2
        working-directory: ${{ runner.temp }}

      - name: Install dependencies
        run: npm ci

      - name: Build external preview client
        run: node scripts/build-browser-client.mjs

      - name: Build daemon
        run: cargo build --release -p fleximarkd

      - name: Stage daemon
        run: node scripts/stage-daemon.mjs

      - name: Upload daemon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-${{ matrix.platform }}-${{ matrix.arch }}
          path: bin
          if-no-files-found: error

  clean-install:
    name: Clean install on ${{ matrix.platform }}-${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: windows-2025, platform: win32, arch: x64 }
          - { os: windows-11-arm, platform: win32, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download universal VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleximark-vsix

      - name: Install packaged extension
        if: runner.os != 'Linux'
        run: npm run smoke -- fleximark.vsix

      - name: Install packaged extension on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -- fleximark.vsix
