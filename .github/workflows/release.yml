name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daemon-platforms:
    name: Build daemon for ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: windows-2025, platform: win32, arch: x64 }
          - { os: windows-11-arm, platform: win32, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Install dependencies
        run: mise run install

      - name: Build external preview client
        run: uv run --frozen python scripts/build.py browser

      - name: Install minimum supported Rust version
        run: rustup toolchain install 1.86.0 --profile minimal

      - name: Check host workspace with minimum Rust version
        env:
          CARGO_TARGET_DIR: target/msrv-1.86
        run: cargo +1.86.0 check --workspace --all-targets --locked

      - name: Verify architecture contract
        run: uv run --frozen python scripts/verify_architecture.py

      - name: Verify performance budgets
        run: uv run --frozen python scripts/check_performance_budgets.py

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Install plugin component target for current Rust version
        run: rustup target add wasm32-wasip2

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build daemon
        run: cargo build --release -p fleximarkd --locked

      - name: Stage daemon
        run: uv run --frozen python scripts/stage_daemon.py

      - name: Upload daemon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-${{ matrix.platform }}-${{ matrix.arch }}
          path: bin
          if-no-files-found: error
          overwrite: true

  validate:
    name: Validate extension
    needs: daemon-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Install dependencies
        run: mise run install

      - name: Build external preview client
        run: uv run --frozen python scripts/build.py browser

      - name: Install minimum supported Rust version
        run: rustup toolchain install 1.86.0 --profile minimal

      - name: Install plugin component target for minimum Rust version
        run: rustup +1.86.0 target add wasm32-wasip2

      - name: Check plugin fixture with minimum Rust version
        env:
          CARGO_TARGET_DIR: target/msrv-fixture-1.86
        run: cargo +1.86.0 check --manifest-path fixtures/plugin-component/Cargo.toml --target wasm32-wasip2 --locked

      - name: Check minimum supported Rust version
        env:
          CARGO_TARGET_DIR: target/msrv-1.86
        run: cargo +1.86.0 check --workspace --all-targets --locked

      - name: Verify dependency lock metadata
        env:
          YARN_ENABLE_HARDENED_MODE: "1"
        run: yarn install --immutable --refresh-lockfile

      - name: Audit dependencies
        run: yarn npm audit --all --recursive --severity high

      - name: Download platform daemons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: daemon-*
          path: bin
          merge-multiple: true

      - name: Create final release manifest
        run: uv run --frozen python scripts/create_release_manifest.py --require-all

      - name: Verify architecture contract
        run: uv run --frozen python scripts/verify_architecture.py

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Install plugin component target for current Rust version
        run: rustup target add wasm32-wasip2

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check types
        run: yarn exec tsc -b

      - name: Lint
        run: yarn exec eslint adapters web test scripts

      - name: Check localization bundles
        run: |
          uv run --frozen python scripts/l10n_export.py
          git diff --exit-code -- l10n

      - name: Build production extension
        run: uv run --frozen python scripts/build.py extension --production

      - name: Run pure RPC and preview tests
        run: mise run test-pure

      - name: Run VS Code integration tests on stable
        run: xvfb-run -a mise run test -- --prebuilt

      - name: Inspect extension contents
        run: yarn exec vsce ls --no-dependencies

  release:
    name: Release
    needs: [daemon-platforms, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release-state.outputs.released }}
      release_version: ${{ steps.release-state.outputs.release_version }}
      release_git_tag: ${{ steps.release-state.outputs.release_git_tag }}
      release_git_head: ${{ steps.release-state.outputs.release_git_head }}
      release_source_git_head: ${{ steps.release-state.outputs.release_source_git_head }}
      vsix_sha256: ${{ steps.release-state.outputs.vsix_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Install dependencies
        run: mise run install

      - name: Download platform daemons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: daemon-*
          path: bin
          merge-multiple: true

      - name: Assemble prebuilt release inputs
        run: |
          uv run --frozen python scripts/create_release_manifest.py --require-all
          uv run --frozen python scripts/build.py extension --production

      - name: Record release source
        id: before-release
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "source_git_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Recover prior semantic release
        id: recovery
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_GIT_HEAD: ${{ steps.before-release.outputs.source_git_head }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          mapfile -t RELEASE_TAGS < <(
            while IFS= read -r tag; do
              TAG_HEAD=$(git rev-parse "${tag}^{}")
              TAG_PARENT=$(git rev-parse "${TAG_HEAD}^1" 2>/dev/null || true)
              if [[ "$TAG_PARENT" == "$SOURCE_GIT_HEAD" ]]; then
                echo "$tag"
              fi
            done < <(git tag --list 'v*')
          )
          if [[ "${#RELEASE_TAGS[@]}" == 0 ]]; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${#RELEASE_TAGS[@]}" != 1 ]]; then
            echo 'release tag is not unique for the workflow source HEAD' >&2
            exit 1
          fi

          RELEASE_TAG=${RELEASE_TAGS[0]}
          RELEASE_GIT_HEAD=$(git rev-parse "${RELEASE_TAG}^{}")
          RELEASE_JSON=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | \
            jq -sc --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("release tag is not unique") end')
          RELEASE_IS_DRAFT=$(jq -r '.draft' <<<"$RELEASE_JSON")
          if [[ "$RELEASE_IS_DRAFT" != "true" && "$RELEASE_IS_DRAFT" != "false" ]]; then
            echo 'recovered GitHub Release draft state is invalid' >&2
            exit 1
          fi
          ASSET_NAMES=$(jq -r '[.assets[].name] | sort | join(",")' <<<"$RELEASE_JSON")
          if [[ "$ASSET_NAMES" != "fleximark.vsix,fleximark.vsix.identity.json" ]]; then
            echo "unexpected GitHub Release assets: $ASSET_NAMES" >&2
            exit 1
          fi
          VSIX_ASSET_ID=$(jq -r '.assets[] | select(.name == "fleximark.vsix") | .id' <<<"$RELEASE_JSON")
          IDENTITY_ASSET_ID=$(jq -r '.assets[] | select(.name == "fleximark.vsix.identity.json") | .id' <<<"$RELEASE_JSON")
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${VSIX_ASSET_ID}" \
            > fleximark.vsix
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${IDENTITY_ASSET_ID}" \
            > fleximark.vsix.identity.json
          export FLEXIMARK_EXPECTED_GIT_TAG="$RELEASE_TAG"
          export FLEXIMARK_EXPECTED_SOURCE_GIT_HEAD="$SOURCE_GIT_HEAD"
          VSIX_SHA256=$(python scripts/release_artifact.py verify \
            --vsix fleximark.vsix \
            --identity fleximark.vsix.identity.json \
            --print-sha256)
          RELEASE_VERSION=$(jq -er '.version' fleximark.vsix.identity.json)
          echo "recovered=true" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_git_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_git_head=$RELEASE_GIT_HEAD" >> "$GITHUB_OUTPUT"
          echo "release_source_git_head=$SOURCE_GIT_HEAD" >> "$GITHUB_OUTPUT"
          echo "vsix_sha256=$VSIX_SHA256" >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.recovery.outputs.recovered != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEXIMARK_RELEASE_SOURCE_GIT_HEAD: ${{ steps.before-release.outputs.source_git_head }}
        run: yarn exec semantic-release

      - name: Detect new release
        id: release-state
        shell: bash
        env:
          BEFORE_VERSION: ${{ steps.before-release.outputs.version }}
          SOURCE_GIT_HEAD: ${{ steps.before-release.outputs.source_git_head }}
          RECOVERED: ${{ steps.recovery.outputs.recovered }}
          RECOVERED_VERSION: ${{ steps.recovery.outputs.release_version }}
          RECOVERED_GIT_TAG: ${{ steps.recovery.outputs.release_git_tag }}
          RECOVERED_GIT_HEAD: ${{ steps.recovery.outputs.release_git_head }}
          RECOVERED_SOURCE_GIT_HEAD: ${{ steps.recovery.outputs.release_source_git_head }}
          RECOVERED_VSIX_SHA256: ${{ steps.recovery.outputs.vsix_sha256 }}
        run: |
          if [[ "$RECOVERED" == "true" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "release_version=$RECOVERED_VERSION" >> "$GITHUB_OUTPUT"
            echo "release_git_tag=$RECOVERED_GIT_TAG" >> "$GITHUB_OUTPUT"
            echo "release_git_head=$RECOVERED_GIT_HEAD" >> "$GITHUB_OUTPUT"
            echo "release_source_git_head=$RECOVERED_SOURCE_GIT_HEAD" >> "$GITHUB_OUTPUT"
            echo "vsix_sha256=$RECOVERED_VSIX_SHA256" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AFTER_VERSION=$(node -p "require('./package.json').version")
          if [[ "$AFTER_VERSION" != "$BEFORE_VERSION" ]]; then
            if [[ ! -f fleximark.vsix || ! -f fleximark.vsix.identity.json ]]; then
              echo 'semantic-release did not produce the release artifact and identity' >&2
              exit 1
            fi
            RELEASE_GIT_TAG="v$AFTER_VERSION"
            RELEASE_GIT_HEAD=$(git rev-parse "${RELEASE_GIT_TAG}^{}")
            if [[ "$RELEASE_GIT_HEAD" != "$(git rev-parse HEAD)" ]]; then
              echo 'release tag does not point at the release commit HEAD' >&2
              exit 1
            fi
            if [[ "$(git rev-parse "${RELEASE_GIT_HEAD}^1")" != "$SOURCE_GIT_HEAD" ]]; then
              echo 'release commit is not based on the workflow source HEAD' >&2
              exit 1
            fi
            export FLEXIMARK_EXPECTED_GIT_TAG="$RELEASE_GIT_TAG"
            export FLEXIMARK_EXPECTED_SOURCE_GIT_HEAD="$SOURCE_GIT_HEAD"
            VSIX_SHA256=$(python scripts/release_artifact.py verify \
              --vsix fleximark.vsix \
              --identity fleximark.vsix.identity.json \
              --print-sha256)
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "release_version=$AFTER_VERSION" >> "$GITHUB_OUTPUT"
            echo "release_git_tag=$RELEASE_GIT_TAG" >> "$GITHUB_OUTPUT"
            echo "release_git_head=$RELEASE_GIT_HEAD" >> "$GITHUB_OUTPUT"
            echo "release_source_git_head=$SOURCE_GIT_HEAD" >> "$GITHUB_OUTPUT"
            echo "vsix_sha256=$VSIX_SHA256" >> "$GITHUB_OUTPUT"
          else
            if [[ -e fleximark.vsix || -e fleximark.vsix.identity.json ]]; then
              echo 'release identity unexpectedly exists on the no-release path' >&2
              exit 1
            fi
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "release_version=" >> "$GITHUB_OUTPUT"
            echo "release_git_tag=" >> "$GITHUB_OUTPUT"
            echo "release_git_head=" >> "$GITHUB_OUTPUT"
            echo "release_source_git_head=" >> "$GITHUB_OUTPUT"
            echo "vsix_sha256=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload exact release artifact
        if: steps.release-state.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleximark-release-vsix
          path: |
            fleximark.vsix
            fleximark.vsix.identity.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  clean-install:
    name: Clean install on ${{ matrix.platform }}-${{ matrix.arch }}
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: windows-2025, platform: win32, arch: x64 }
          - { os: windows-11-arm, platform: win32, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Install dependencies
        run: mise run install

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleximark-release-vsix

      - name: Verify exact release identity
        env:
          FLEXIMARK_EXPECTED_SHA256: ${{ needs.release.outputs.vsix_sha256 }}
          FLEXIMARK_EXPECTED_GIT_TAG: ${{ needs.release.outputs.release_git_tag }}
          FLEXIMARK_EXPECTED_SOURCE_GIT_HEAD: ${{ needs.release.outputs.release_source_git_head }}
        run: python scripts/release_artifact.py verify --vsix fleximark.vsix --identity fleximark.vsix.identity.json

      - name: Install packaged extension
        if: runner.os != 'Linux'
        run: mise run smoke -- fleximark.vsix

      - name: Install packaged extension on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a mise run smoke -- fleximark.vsix

  attest:
    name: Attest exact release artifact
    needs: [release, clean-install]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleximark-release-vsix

      - name: Verify exact release identity
        env:
          FLEXIMARK_EXPECTED_SHA256: ${{ needs.release.outputs.vsix_sha256 }}
          FLEXIMARK_EXPECTED_GIT_TAG: ${{ needs.release.outputs.release_git_tag }}
          FLEXIMARK_EXPECTED_SOURCE_GIT_HEAD: ${{ needs.release.outputs.release_source_git_head }}
        run: python scripts/release_artifact.py verify --vsix fleximark.vsix --identity fleximark.vsix.identity.json

      - name: Attest released VSIX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: fleximark.vsix

  publish-github-release:
    name: Publish verified GitHub Release draft
    needs: [release, clean-install, attest]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleximark-release-vsix

      - name: Verify exact release identity before publication
        env:
          FLEXIMARK_EXPECTED_SHA256: ${{ needs.release.outputs.vsix_sha256 }}
          FLEXIMARK_EXPECTED_GIT_TAG: ${{ needs.release.outputs.release_git_tag }}
          FLEXIMARK_EXPECTED_SOURCE_GIT_HEAD: ${{ needs.release.outputs.release_source_git_head }}
        run: python scripts/release_artifact.py verify --vsix fleximark.vsix --identity fleximark.vsix.identity.json

      - name: Verify exact GitHub Release assets
        id: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.release_git_tag }}
          FLEXIMARK_EXPECTED_SHA256: ${{ needs.release.outputs.vsix_sha256 }}
          FLEXIMARK_EXPECTED_GIT_TAG: ${{ needs.release.outputs.release_git_tag }}
          FLEXIMARK_EXPECTED_SOURCE_GIT_HEAD: ${{ needs.release.outputs.release_source_git_head }}
        run: |
          RELEASE_JSON=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | \
            jq -sc --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("release tag is not unique") end')
          RELEASE_IS_DRAFT=$(jq -r '.draft' <<<"$RELEASE_JSON")
          if [[ "$RELEASE_IS_DRAFT" != "true" && "$RELEASE_IS_DRAFT" != "false" ]]; then
            echo 'GitHub Release draft state is invalid' >&2
            exit 1
          fi
          ASSET_NAMES=$(jq -r '[.assets[].name] | sort | join(",")' <<<"$RELEASE_JSON")
          if [[ "$ASSET_NAMES" != "fleximark.vsix,fleximark.vsix.identity.json" ]]; then
            echo "unexpected GitHub Release assets: $ASSET_NAMES" >&2
            exit 1
          fi
          RELEASE_ID=$(jq -r '.id' <<<"$RELEASE_JSON")
          VSIX_ASSET_ID=$(jq -r '.assets[] | select(.name == "fleximark.vsix") | .id' <<<"$RELEASE_JSON")
          IDENTITY_ASSET_ID=$(jq -r '.assets[] | select(.name == "fleximark.vsix.identity.json") | .id' <<<"$RELEASE_JSON")
          mkdir release-assets
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${VSIX_ASSET_ID}" \
            > release-assets/fleximark.vsix
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${IDENTITY_ASSET_ID}" \
            > release-assets/fleximark.vsix.identity.json
          python scripts/release_artifact.py verify \
            --vsix release-assets/fleximark.vsix \
            --identity release-assets/fleximark.vsix.identity.json
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "release_is_draft=$RELEASE_IS_DRAFT" >> "$GITHUB_OUTPUT"

      - name: Publish the exact draft if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IS_DRAFT: ${{ steps.release-assets.outputs.release_is_draft }}
          RELEASE_ID: ${{ steps.release-assets.outputs.release_id }}
        run: |
          if [[ "$RELEASE_IS_DRAFT" == "true" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false >/dev/null
          elif [[ "$RELEASE_IS_DRAFT" != "false" ]]; then
            echo 'GitHub Release draft state is invalid' >&2
            exit 1
          else
            echo 'GitHub Release is already public; skipping draft publication'
          fi

      - name: Verify public GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.release_git_tag }}
          FLEXIMARK_EXPECTED_SHA256: ${{ needs.release.outputs.vsix_sha256 }}
          FLEXIMARK_EXPECTED_GIT_TAG: ${{ needs.release.outputs.release_git_tag }}
          FLEXIMARK_EXPECTED_SOURCE_GIT_HEAD: ${{ needs.release.outputs.release_source_git_head }}
        run: |
          mkdir github-release
          gh release download "$RELEASE_TAG" \
            --pattern 'fleximark.vsix*' \
            --dir github-release
          python scripts/release_artifact.py verify \
            --vsix github-release/fleximark.vsix \
            --identity github-release/fleximark.vsix.identity.json

  publish-marketplace:
    name: Publish to Visual Studio Marketplace
    needs: [release, clean-install, attest, publish-github-release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.13

      - name: Install dependencies
        run: mise run install

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleximark-release-vsix

      - name: Verify exact release identity
        env:
          FLEXIMARK_EXPECTED_SHA256: ${{ needs.release.outputs.vsix_sha256 }}
          FLEXIMARK_EXPECTED_GIT_TAG: ${{ needs.release.outputs.release_git_tag }}
          FLEXIMARK_EXPECTED_SOURCE_GIT_HEAD: ${{ needs.release.outputs.release_source_git_head }}
        run: python scripts/release_artifact.py verify --vsix fleximark.vsix --identity fleximark.vsix.identity.json

      - name: Publish exact VSIX with OIDC
        run: >-
          yarn exec vsce publish
