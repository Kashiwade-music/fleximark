name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2
        working-directory: ${{ runner.temp }}

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check types
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Check localization bundles
        run: npm run l10n:check

      - name: Build production extension
        run: npm run build

      - name: Run VS Code integration tests on stable
        run: xvfb-run -a npm test

      - name: Inspect extension contents
        run: npm exec -- vsce ls

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      released: ${{ steps.release-state.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2
        working-directory: ${{ runner.temp }}

      - name: Install dependencies
        run: npm ci

      - name: Record current version
        id: before-release
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec -- semantic-release

      - name: Detect new release
        id: release-state
        shell: bash
        env:
          BEFORE_VERSION: ${{ steps.before-release.outputs.version }}
        run: |
          AFTER_VERSION=$(node -p "require('./package.json').version")
          if [[ "$AFTER_VERSION" != "$BEFORE_VERSION" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate released VSIX
        if: steps.release-state.outputs.released == 'true'
        shell: bash
        run: |
          unzip -t fleximark.vsix
          if unzip -Z1 fleximark.vsix | grep -E '(^|/)(src|test|markdown_for_debug|node_modules)/|(^|/)parserPlugin\.js$'; then
            echo 'Unexpected development files found in VSIX' >&2
            exit 1
          fi

      - name: Attest released VSIX
        if: steps.release-state.outputs.released == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: fleximark.vsix

      - name: Upload VSIX for Marketplace publishing
        if: steps.release-state.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleximark-release-vsix
          path: fleximark.vsix
          retention-days: 7
          if-no-files-found: error

  publish-marketplace:
    name: Publish to Visual Studio Marketplace
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2
        working-directory: ${{ runner.temp }}

      - name: Install dependencies
        run: npm ci

      - name: Download attested VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleximark-release-vsix

      - name: Publish exact VSIX with OIDC
        run: npm exec -- vsce publish --packagePath fleximark.vsix --oidc
