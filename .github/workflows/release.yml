name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daemon-platforms:
    name: Build daemon for ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: windows-2025, platform: win32, arch: x64 }
          - { os: windows-11-arm, platform: win32, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2
        working-directory: ${{ runner.temp }}

      - name: Install dependencies
        run: npm ci

      - name: Verify architecture contract
        run: node scripts/verify-architecture.mjs

      - name: Verify performance budgets
        run: node scripts/check-performance-budgets.mjs

      - name: Build external preview client
        run: node scripts/build-browser-client.mjs

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build daemon
        run: cargo build --release -p fleximarkd

      - name: Stage daemon
        run: node scripts/stage-daemon.mjs

      - name: Upload daemon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-${{ matrix.platform }}-${{ matrix.arch }}
          path: bin
          if-no-files-found: error

  validate:
    name: Validate extension
    needs: daemon-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2
        working-directory: ${{ runner.temp }}

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Download platform daemons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: daemon-*
          path: bin
          merge-multiple: true

      - name: Build external preview client
        run: node scripts/build-browser-client.mjs

      - name: Verify architecture contract
        run: node scripts/verify-architecture.mjs

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check types
        run: npm exec -- tsc --noEmit

      - name: Lint
        run: npm exec -- eslint adapters web test scripts

      - name: Check localization bundles
        run: |
          node scripts/l10n-export.mjs
          git diff --exit-code -- l10n

      - name: Build production extension
        run: node esbuild.js --production

      - name: Run VS Code integration tests on stable
        run: xvfb-run -a npm test

      - name: Create final release manifest
        run: node scripts/create-release-manifest.mjs --require-all

      - name: Inspect extension contents
        run: npm exec -- vsce ls

      - name: Package release candidate
        run: npm exec -- vsce package --out fleximark.vsix

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleximark-candidate-vsix
          path: fleximark.vsix
          if-no-files-found: error

  clean-install:
    name: Clean install on ${{ matrix.platform }}-${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: windows-2025, platform: win32, arch: x64 }
          - { os: windows-11-arm, platform: win32, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleximark-candidate-vsix

      - name: Install packaged extension
        if: runner.os != 'Linux'
        run: npm run smoke -- fleximark.vsix

      - name: Install packaged extension on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -- fleximark.vsix

  release:
    name: Release
    needs: [clean-install, daemon-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      released: ${{ steps.release-state.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2
        working-directory: ${{ runner.temp }}

      - name: Install dependencies
        run: npm ci

      - name: Download platform daemons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: daemon-*
          path: bin
          merge-multiple: true

      - name: Assemble signed-input package
        run: |
          node scripts/create-release-manifest.mjs --require-all
          node esbuild.js --production

      - name: Record current version
        id: before-release
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec -- semantic-release

      - name: Detect new release
        id: release-state
        shell: bash
        env:
          BEFORE_VERSION: ${{ steps.before-release.outputs.version }}
        run: |
          AFTER_VERSION=$(node -p "require('./package.json').version")
          if [[ "$AFTER_VERSION" != "$BEFORE_VERSION" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate released VSIX
        if: steps.release-state.outputs.released == 'true'
        shell: bash
        run: |
          unzip -t fleximark.vsix
          if unzip -Z1 fleximark.vsix | grep -E '(^|/)(src|test|markdown_for_debug|node_modules)/|(^|/)parserPlugin\.js$'; then
            echo 'Unexpected development files found in VSIX' >&2
            exit 1
          fi

      - name: Attest released VSIX
        if: steps.release-state.outputs.released == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: fleximark.vsix

      - name: Upload VSIX for Marketplace publishing
        if: steps.release-state.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleximark-release-vsix
          path: fleximark.vsix
          retention-days: 7
          if-no-files-found: error

  publish-marketplace:
    name: Publish to Visual Studio Marketplace
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2
        working-directory: ${{ runner.temp }}

      - name: Install dependencies
        run: npm ci

      - name: Download attested VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleximark-release-vsix

      - name: Publish exact VSIX with OIDC
        run: npm exec -- vsce publish --packagePath fleximark.vsix --oidc
