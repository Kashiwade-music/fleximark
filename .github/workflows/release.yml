name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
        with:
          install-dependencies: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: product-*
          path: .artifacts
          merge-multiple: true
      - name: Verify release assets and immutable source identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_GIT_HEAD: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python tooling/tasks/tasks.py release-assets --root .artifacts --source-git-head "$SOURCE_GIT_HEAD" --tag "$RELEASE_REF"
      - name: Attest every exact distribution artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            .artifacts/**/*.zip
            .artifacts/**/*.vsix
            .artifacts/**/*.identity.json
      - name: Create draft with verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_REF" >/dev/null 2>&1 || gh release create "$RELEASE_REF" --verify-tag --draft --generate-notes
          find .artifacts -type f \( -name '*.zip' -o -name '*.sha256' -o -name '*.vsix' -o -name '*.identity.json' \) -print0 | xargs -0 gh release upload "$RELEASE_REF"
