name: Full verification (manual)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Read distribution targets
        id: matrix
        run: python tooling/tasks/tasks.py ci matrix

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
      - name: Verify source quality
        run: python tooling/tasks/tasks.py ci quality
      - name: Audit dependencies
        run: python tooling/tasks/tasks.py audit

  zed-product:
    name: Build universal Zed extension
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
      - name: Build and stage Zed WASM product
        run: python tooling/tasks/tasks.py ci zed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-zed
          include-hidden-files: true
          path: |
            .artifacts/**/fleximark-zed-*.zip
            .artifacts/**/fleximark-zed-*.zip.sha256
          if-no-files-found: error
          overwrite: true

  products:
    name: Package and smoke ${{ matrix.target }}
    needs: [quality, matrix]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
      - name: Test Rust on macOS and Windows
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked
      - name: Verify native and editor product on Linux
        if: runner.os == 'Linux'
        env:
          SOURCE_GIT_HEAD: ${{ github.sha }}
          FLEXIMARK_BROWSER_DOM: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: xvfb-run -a python tooling/tasks/tasks.py ci product
      - name: Verify native and editor product on macOS and Windows
        if: runner.os != 'Linux'
        env:
          SOURCE_GIT_HEAD: ${{ github.sha }}
          # macOS's default temp path exceeds the Unix socket limit for nested Code profiles.
          TMPDIR: ${{ runner.temp }}
        run: python tooling/tasks/tasks.py ci product
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-${{ matrix.target }}
          include-hidden-files: true
          path: |
            .artifacts/**/*.zip
            .artifacts/**/*.zip.sha256
            .artifacts/**/*.vsix
            .artifacts/**/*.identity.json
          if-no-files-found: error
          overwrite: true
