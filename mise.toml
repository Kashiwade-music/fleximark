min_version = "2026.5.12"

[tools]
node = "24.21.0"
python = "3.14.7"
rust = "1.95.0"
uv = "0.12.12"

[settings]
idiomatic_version_file_enable_tools = ["yarn"]

[tasks.install]
description = "Install the locked JavaScript and Python dependencies"
run = [
  "yarn install --immutable",
  "uv sync --frozen",
  "rustup target add wasm32-wasip2",
]

[tasks.build]
description = "Build the shared runtime and both complete editor products"
run = "uv run --frozen python tooling/tasks/tasks.py build"

[tasks.build-all]
description = "Build all shared runtime and editor products"
run = "uv run --frozen python tooling/tasks/tasks.py build-all"

[tasks.build-core]
description = "Build independent Rust document and application libraries"
run = "uv run --frozen python tooling/tasks/tasks.py build-core"

[tasks.build-runtime]
description = "Build and assemble the native runtime with external browser resources"
run = "uv run --frozen python tooling/tasks/tasks.py build-runtime"

[tasks.build-vscode]
description = "Build the complete VS Code product with the shared native runtime"
run = "uv run --frozen python tooling/tasks/tasks.py build-vscode"

[tasks.build-zed]
description = "Build the Zed extension and its shared runtime distribution"
run = "uv run --frozen python tooling/tasks/tasks.py build-zed"

[tasks.protocol-generate]
description = "Regenerate Rust-owned protocol Schema and TypeScript artifacts"
run = "uv run --frozen python tooling/tasks/tasks.py protocol-generate"

[tasks.protocol-check]
description = "Fail when generated protocol artifacts differ from the Rust contract"
run = "uv run --frozen python tooling/tasks/tasks.py protocol-check"

[tasks.clean]
description = "Remove generated JavaScript and test output"
run = "uv run --frozen python tooling/tasks/tasks.py clean"

[tasks.dev]
description = "Watch the VS Code adapter, preview bundles, and TypeScript types"
run = "uv run --frozen python tooling/tasks/tasks.py dev"

[tasks.test]
description = "Build the product and run the VS Code integration suite"
run = "uv run --frozen python tooling/tasks/tasks.py test"

[tasks.test-pure]
description = "Run RPC and preview tests in Node without VS Code Electron"
run = "uv run --frozen python tooling/tasks/tasks.py test-pure"

[tasks.verify]
description = "Run the complete local release gate"
run = "uv run --frozen python tooling/tasks/tasks.py verify"

[tasks.package]
description = "Verify and package a dependency-free VSIX"
run = "uv run --frozen python tooling/tasks/tasks.py package"

[tasks.smoke]
description = "Smoke-test a packaged VSIX"
run = "uv run --frozen python tooling/tasks/tasks.py smoke"

[tasks.l10n]
description = "Regenerate the English localization bundle"
run = "uv run --frozen python tooling/tasks/tasks.py l10n"
