min_version = "2026.5.12"

[tools]
node = "24.21.0"
python = "3.14.7"
rust = "1.95.0"
uv = "0.12.12"

[settings]
idiomatic_version_file_enable_tools = ["yarn"]

# Public commands delegate to one Python CLI. Arguments are forwarded unchanged.
[tasks.default]
hide = true
run = "python tooling/tasks/tasks.py"

[tasks.help]
description = "Show commands and their scope; use COMMAND --help for arguments"
run = "python tooling/tasks/tasks.py"

[tasks.setup]
description = "Install project dependencies and pinned submodules (after mise install)"
run = "python tooling/tasks/tasks.py setup"

[tasks.build]
description = "Build a required target: core | runtime | vscode | zed | all"
run = "python tooling/tasks/tasks.py build"

[tasks.watch]
description = "Build VS Code only, then watch JS/TS; F5 launches it; Rust is not watched"
run = "python tooling/tasks/tasks.py watch"

[tasks.check]
description = "Check generated files, architecture, types, formatting and lint; no test suites"
run = "python tooling/tasks/tasks.py check"

[tasks.test]
description = "Run Python/Rust/Node tests; use test editor for VS Code integration"
run = "python tooling/tasks/tasks.py test"

[tasks.package]
description = "Build/package a required target: runtime | vscode | zed | all; no tests"
run = "python tooling/tasks/tasks.py package"

[tasks.verify]
description = "All checks/tests + audit + all builds + performance + VSIX + clean-install smoke"
run = "python tooling/tasks/tasks.py verify"

[tasks.audit]
description = "Query registry for high/critical JavaScript dependency vulnerabilities"
run = "python tooling/tasks/tasks.py audit"

[tasks.smoke]
description = "Clean-install and test an existing VSIX (requires its path)"
run = "python tooling/tasks/tasks.py smoke"

[tasks.generate]
description = "Update protocol | l10n | versions | architecture | all"
run = "python tooling/tasks/tasks.py generate"

[tasks.clean]
description = "Remove JS/TS and test output in .build; keep target and .artifacts"
run = "python tooling/tasks/tasks.py clean"
