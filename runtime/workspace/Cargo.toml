[package]
name = "fleximark-workspace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fleximark_workspace"
path = "src/lib.rs"

[dependencies]
fleximark-plugin-api = { path = "../../core/plugin-api" }
fleximark-config = { path = "../../contracts/config" }
fleximark-preview-assets = { path = "../preview-assets" }
base64.workspace = true
cap-std = "3.4.6"
cap-fs-ext = "3.4.6"
fleximark-engine = { path = "../../core/engine" }
fleximark-application = { path = "../../application" }
fleximark-model = { path = "../../core/model" }
fleximark-plugin-sdk = { path = "../../contracts/plugin" }
fleximark-plugin-host = { path = "../../runtime/wasm-plugins" }
fleximark-render-html = { path = "../../core/render-html" }
getrandom = "0.2.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
