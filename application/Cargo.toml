[package]
name = "fleximark-application"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
fleximark-model = { path = "../core/model" }
fleximark-plugin-api = { path = "../core/plugin-api" }
fleximark-language = { path = "../core/language" }
fleximark-engine = { path = "../core/engine" }
fleximark-render-html = { path = "../core/render-html" }
serde.workspace = true
sha2.workspace = true

fleximark-config = { path = "../contracts/config" }
fleximark-preview-assets = { path = "../runtime/preview-assets" }
