cap-std = "3.4.6"
cap-fs-ext = "3.4.6"
fleximark-plugin-sdk = { path = "../contracts/plugin" }
fleximark-plugin-host = { path = "../runtime/wasm-plugins" }
getrandom = "0.2.17"
serde_json.workspace = true
toml.workspace = true
fleximark-migration = { path = "../migration" }

[dev-dependencies]
ed25519-dalek.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
