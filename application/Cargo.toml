[package]
name = "fleximark-application"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
fleximark-protocol = { path = "../contracts/protocol" }
fleximark-model = { path = "../core/model" }
fleximark-language = { path = "../core/language" }
fleximark-engine = { path = "../core/engine" }
fleximark-render-html = { path = "../core/render-html" }
serde.workspace = true
sha2.workspace = true

fleximark-config = { path = "../contracts/config" }
fleximark-preview-assets = { path = "../runtime/preview-assets" }
base64.workspace = true
cap-std = "3.4.6"
cap-fs-ext = "3.4.6"
getrandom = "0.4.3"
serde_json.workspace = true
toml.workspace = true
fleximark-migration = { path = "../migration" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
fleximark-test-support = { path = "../dev/test-support" }
