output = "architecture"
[limits]
max_code_lines = 1000
max_role_chars = 80
[diagrams]
targets = "lib-bin"
[visible_to]
fleximark-fixture-plugin = []

# Only the official wit_bindgen export macro reexported by the current SDK.
# Invocation is isolated in src/registration.rs; all handwritten hook logic,
# Guest implementation, and tests remain subject to normal reference analysis.
[analysis]
trusted_macros = ["fleximark_plugin_sdk::component::export"]
